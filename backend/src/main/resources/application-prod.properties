# 프로덕션 환경 설정 — SPRING_PROFILES_ACTIVE=prod 로 활성화
# H2 + DataInitializer는 @Profile("!prod") 로 자동 비활성화됨

# 서버 (컨테이너 표준 8080)
server.port=8080

# ── 데이터베이스 ──────────────────────────────────────────────────────
# 비용 절감: happiness-app과 같은 Railway PostgreSQL 인스턴스 공유 가능
# 같은 인스턴스를 공유할 때는 DB_SCHEMA=admin 으로 스키마를 분리한다.
# Railway 대시보드에서 happiness-app 프로젝트의 PostgreSQL 변수를 참조:
#   DB_URL      = postgresql://user:pass@host:5432/railway
#   DB_USERNAME = postgres
#   DB_PASSWORD = (Railway PostgreSQL 패스워드)
#   DB_SCHEMA   = admin   ← admin 앱 전용 스키마 (happiness-app은 public 사용)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — 최초 연결 시 admin 스키마를 자동 생성하고 search_path 설정
spring.datasource.hikari.connection-init-sql=\
  CREATE SCHEMA IF NOT EXISTS ${DB_SCHEMA:admin};\
  SET search_path TO ${DB_SCHEMA:admin}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 콘솔 비활성화
spring.h2.console.enabled=false

# ── JPA ──────────────────────────────────────────────────────────────
spring.main.lazy-initialization=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:admin}
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── JWT ──────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400}

# ── 로깅 ─────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.happiness=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# ── Actuator (헬스체크용, 인증 불필요) ──────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
