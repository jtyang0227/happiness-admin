spring.application.name=happiness-admin
server.port=8081

# JWT
jwt.secret=${JWT_SECRET:dev-happiness-admin-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400}

# Claude API (신고 트리아지 AI 어시스트) — ANTHROPIC_API_KEY 환경변수로만 주입, 하드코딩 금지
# 키가 없어도 서버 기동은 실패하지 않는다 — 실제 "AI 분석 실행" 클릭 시점에만 필요하다.

# CORS 설정
server.servlet.context-path=/

# 기본 설정
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# H2 데이터베이스 설정
spring.datasource.url=jdbc:h2:mem:happinessadmindb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 콘솔 활성화
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA 설정
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true
